name: Weekly Progress Report

on:
  schedule:
    - cron: "0 8 * * 0"   # Every Sunday at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate weekly report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p weekly-summaries

          SINCE="$(date -u -d '6 days ago' +%Y-%m-%d)"
          UNTIL="$(date -u +%Y-%m-%d)"
          WEEK="$(date -u +%G-W%V)"
          REPORT="weekly-summaries/${WEEK}.md"
          DATE_RE='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

          {
            echo "# Weekly Progress Report — ${WEEK}"
            echo
            echo "**Period:** ${SINCE} to ${UNTIL} UTC"
            echo
            echo "## Daily Progress"
            echo

            found_logs=false

            if [ -d progress ]; then
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                found_logs=true
                member="$(dirname "$file" | sed 's#^progress/##')"
                day="$(basename "$file" .md)"

                echo "### ${member} — ${day}"
                echo
                sed '1{/^# /d;}' "$file"
                echo
                echo "---"
                echo
              done < <(
                find progress -type f -name '*.md' -print 2>/dev/null |
                sort |
              while IFS= read -r file; do
                day="$(basename "$file" .md)"
              
                if [[ "$day" =~ $DATE_RE ]] &&
                   ! [[ "$day" < "$SINCE" || "$day" > "$UNTIL" ]]; then
                  printf '%s\n' "$file"
                fi
              done                
              )
            fi

            if [ "$found_logs" = false ]; then
              echo "No daily progress logs were found for this period."
              echo
            fi

            echo "## Commits in This Repository"
            echo
            echo "| Member | Commits |"
            echo "|--------|---------|"

            git log \
              --since="${SINCE} 00:00:00 UTC" \
              --until="${UNTIL} 23:59:59 UTC" \
              --format='%aN' |
              sort |
              uniq -c |
              sort -rn |
              awk '{ count=$1; $1=""; sub(/^ +/, ""); printf "| %s | %d |\n", $0, count }'

          } > "$REPORT"

          echo "Created ${REPORT}"
          cat "$REPORT"

      - name: Commit report permanently
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weekly-summaries/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add weekly progress report"
            git push origin main
          fi
